name: Publier le site

# Le site est du HTML statique : sa fraîcheur est celle du dernier build.
# Un prix change tous les 1 à 2 jours, une passe toutes les deux heures suffit largement.
#
# L'heure est en UTC, mais le décalage de Paris est un nombre entier d'heures : « pile » ici
# reste « pile » à l'affichage. GitHub décale souvent les tâches planifiées de quelques minutes,
# et d'autant plus à l'heure pile, qui est le créneau le plus chargé.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      # Le feu vert ne bascule que cinq fois par an : sans ce déclencheur, on ne saurait pas
      # avant des semaines si la chaîne fonctionne. Le test ignore les garde-fous, rien d'autre.
      notification_de_test:
        description: Envoyer une notification de test
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # pour lire et réécrire la base, stockée en asset de release
  pages: write
  id-token: write

# Deux exécutions simultanées écriraient la même base : on sérialise.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # La base vit entre deux exécutions comme asset de la release « data », pas dans
      # l'historique git : 4 Mo réécrits en permanence n'ont rien à y faire.
      - name: Récupérer la base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download data --pattern carbu.db --dir data --clobber; then
            echo "Base récupérée : $(du -h data/carbu.db | cut -f1)"
          else
            echo "Aucune base publiée — reconstruction complète depuis les archives annuelles."
            echo "Ne devrait arriver qu'au tout premier lancement, ou si l'asset a été perdu."
            npm run backfill
          fi

      - name: Récupérer les prix du moment
        run: npm run ingest

      # Un site statique n'a pas de serveur, mais ce job en est un : réseau, base à jour, et il
      # sait ce qui vient de changer. Il ne notifie que la bascule au feu vert — cinq fois par an.
      # Un échec d'envoi ne doit pas empêcher la publication du site, qui est l'essentiel.
      - name: Prévenir si le feu passe au vert
        continue-on-error: true
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TEST: ${{ inputs.notification_de_test && '1' || '' }}
        run: npm run notify

      - name: Générer le site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        # L'empreinte de l'abonnement est publiée dans la page : c'est ce qui permet à l'app de
        # constater que le téléphone n'est plus abonné et de réclamer un nouveau copier-coller,
        # au lieu de se taire pendant des mois — le silence étant le comportement normal.
        run: |
          export NEXT_PUBLIC_PUSH_FINGERPRINT="$(npx tsx scripts/push-fingerprint.ts)"
          echo "Empreinte publiée : ${NEXT_PUBLIC_PUSH_FINGERPRINT:-aucune}"
          npm run build

      # Après le build : si la génération échoue, la base publiée reste celle d'avant.
      - name: Republier la base
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data data/carbu.db --clobber

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deploiement
        uses: actions/deploy-pages@v4
